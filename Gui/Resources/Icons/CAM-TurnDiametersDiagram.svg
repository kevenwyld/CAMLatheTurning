<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="190" height="112" viewBox="0 0 190 112">
  <!-- the working zone between the two diameters -->
  <rect x="12" y="26" width="138" height="44" style="fill:#8be869;fill-opacity:0.35;stroke:none"/>
  <!-- the part: a tube (its wall), and the bore below it -->
  <rect x="12" y="40" width="98" height="30" style="fill:#646464;stroke:none"/>
  <path d="M 12,40 H 110 V 70" style="fill:none;stroke:#999999;stroke-width:2"/>
  <!-- the two diameters -->
  <path d="M 12,26 H 156" style="fill:none;stroke:#999999;stroke-width:1.5;stroke-dasharray:5,3"/>
  <path d="M 12,70 H 156" style="fill:none;stroke:#999999;stroke-width:1.5;stroke-dasharray:5,3"/>
  <!-- the axis -->
  <path d="M 6,104 H 156" style="fill:none;stroke:#999999;stroke-width:1.2;stroke-dasharray:10,3,2,3"/>
  <!-- radii from the axis, with callouts -->
  <path d="M 166,104 V 30" style="fill:none;stroke:#999999;stroke-width:1.5"/>
  <path d="M 166,26 l -4,7 h 8 Z" style="fill:#999999;stroke:none"/>
  <path d="M 180,104 V 74" style="fill:none;stroke:#999999;stroke-width:1.5"/>
  <path d="M 180,70 l -4,7 h 8 Z" style="fill:#999999;stroke:none"/>
</svg>
